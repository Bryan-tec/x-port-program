name: xport ci pipeline

"on":
  push:
    branches:
      - main
      - 'feature/**'
    paths:
      - '.github/workflows/ci.yml'
      - 'app.py'

jobs:
  validation:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    runs-on: ${{ matrix.os }}
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.14'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run tests
        run: |
          python -m pytest -v tests/

  coverage:
    ##needs: validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.14'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run tests with coverage
        run: |
          python -m pytest --cov=app tests/

  docker-build:
    needs: [validation, coverage]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Docker image
        run: |
          docker build -t xport-app .

      - name: Run Docker container
        run: |
          docker run -d -p 5500:5500 xport-app

      - name: Test Docker container
        run: |
          sleep 5 # Wait for the container to start
          curl http://localhost:5500

  upload-registry:
    needs: docker-build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build Docker image
        run: |
          docker build -t xport-app .

      - name: Tag Docker image
        run: |
          docker tag xport-app ${{ secrets.DOCKER_USERNAME }}/xport-app:v${{ github.run_number }}
          docker tag xport-app ${{ secrets.DOCKER_USERNAME }}/xport-app:latest

      - name: Push Docker images
        run: |
          docker push ${{ secrets.DOCKER_USERNAME }}/xport-app:v${{ github.run_number }}
          docker push ${{ secrets.DOCKER_USERNAME }}/xport-app:latest